name: release

# Cut a release by pushing a tag:
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (must already exist)'
        required: true

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Never ship a binary from a red tree.
      - name: go test
        run: go test ./...

      - name: Build
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # Pure-Go stdlib only, so every target cross-compiles from this runner.
          # CGO_ENABLED=0 gives a static binary; -trimpath keeps runner paths out
          # of it so the build does not leak the checkout directory.
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            outdir="dist/council_${VERSION}_${goos}_${goarch}"
            mkdir -p "$outdir"

            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$outdir/council" \
              ./cmd/council

            cp README.md "$outdir/"
            tar -czf "${outdir}.tar.gz" -C dist "$(basename "$outdir")"
            rm -rf "$outdir"
            echo "built ${outdir}.tar.gz"
          done

          # Also ship the Apple Silicon binary bare, so it can be downloaded and
          # run without unpacking an archive first.
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/council_${VERSION}_darwin_arm64" \
            ./cmd/council

          cd dist && sha256sum * > checksums.txt
          cat checksums.txt

      - name: Verify the Apple Silicon binary is what it claims
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          out="$(file "dist/council_${VERSION}_darwin_arm64")"
          echo "$out"
          # Match the two facts independently rather than a full phrase: GNU file
          # on the runner says "Mach-O 64-bit arm64 executable" while BSD file on
          # macOS says "Mach-O 64-bit executable arm64".
          echo "$out" | grep -q "Mach-O" || { echo "not a Mach-O binary"; exit 1; }
          echo "$out" | grep -q "arm64"  || { echo "not arm64";           exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<EOF
          ## Install

          \`\`\`bash
          brew install donald-jackson/tap/council
          \`\`\`

          Prebuilt binaries for macOS (Apple Silicon and Intel) and Linux
          (x86_64 and arm64). Homebrew-installed binaries are not quarantined
          by Gatekeeper.

          ### Without Homebrew

          \`\`\`bash
          gh release download ${VERSION} --repo ${{ github.repository }} \\
            --pattern 'council_${VERSION}_darwin_arm64'
          chmod +x council_${VERSION}_darwin_arm64
          mv council_${VERSION}_darwin_arm64 /usr/local/bin/council
          council version
          \`\`\`

          A binary downloaded through a browser is quarantined because it is
          unsigned. Clear it with:

          \`\`\`bash
          xattr -d com.apple.quarantine ./council
          \`\`\`

          ## Setup

          \`\`\`bash
          council setup
          \`\`\`

          Prompts for your OpenRouter API key without echoing it, verifies it
          against the API, and stores it in \`~/.config/council/config.env\`
          with mode 0600 so \`council\` works from any directory.

          ## Other platforms

          \`.tar.gz\` archives are attached for darwin/arm64, darwin/amd64,
          linux/amd64 and linux/arm64. Verify with \`checksums.txt\`.
          EOF

          # The upload is the one step that cannot be retried by re-running the
          # job cheaply — everything before it is deterministic, this part talks to
          # the API. A transient 5xx here (GitHub returned 503 on the first attempt
          # at this release) should not throw away a good build, so retry with
          # backoff and treat an already-created release as success.
          for attempt in 1 2 3 4 5; do
            if gh release view "${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release ${VERSION} already exists; uploading assets to it."
              if gh release upload "${VERSION}" dist/* \
                   --repo "${{ github.repository }}" --clobber; then
                echo "Assets uploaded."
                exit 0
              fi
            elif gh release create "${VERSION}" \
                   --repo "${{ github.repository }}" \
                   --title "${VERSION}" \
                   --notes-file /tmp/notes.md \
                   dist/*; then
              echo "Release ${VERSION} created."
              exit 0
            fi

            echo "Attempt ${attempt} failed; retrying in $((attempt * 20))s."
            sleep $((attempt * 20))
          done

          echo "Could not publish the release after 5 attempts."
          exit 1

  # Point the Homebrew tap at the release that was just published, so `brew upgrade`
  # picks it up without a manual step.
  #
  # This needs a token that can write to donald-jackson/homebrew-tap; the automatic
  # GITHUB_TOKEN is scoped to this repository alone. Without the secret the job is
  # skipped rather than failed — a missing tap bump should never retroactively mark a
  # good release as broken, and the formula can always be refreshed by running
  # scripts/update-tap.sh locally.
  tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is a tap token configured?
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TAP_TOKEN is not set; skipping the Homebrew tap update. Run scripts/update-tap.sh ${{ inputs.tag || github.ref_name }} locally to publish the formula."
          fi

      - name: Update the Homebrew formula
        if: steps.token.outputs.present == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-tap.sh "${{ inputs.tag || github.ref_name }}"
