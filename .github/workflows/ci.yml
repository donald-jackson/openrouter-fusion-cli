name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The whole suite is hermetic: httptest servers and captured fixtures, no
      # network and no API key. A green CI run means the parsers still match the
      # real API response committed under internal/openrouter/testdata.
      - name: go test
        run: go test -race ./...

      # Proves the release targets compile before a tag is ever cut.
      - name: cross-compile check
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -trimpath -o /dev/null ./cmd/council
            echo "ok $target"
          done
